<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nostromo Console</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🛰️ Nostromo Console</h1>
    <span id="status" class="badge">disconnected</span>
    <span id="count" class="badge">0 events</span>
    <span class="spacer"></span>
    <span class="badge" id="relayinfo">relay</span>
  </header>

  <main>
    <section class="sidebar">
      <label for="kinds">Kinds (comma separated, e.g. 0,1,3)</label>
      <input id="kinds" placeholder="leave empty for all" />

      <label for="authors">Authors (hex pubkeys, one per line)</label>
      <textarea id="authors"></textarea>

      <label for="search">Search (NIP-50)</label>
      <input id="search" />

      <label for="limit">Limit</label>
      <input id="limit" value="100" />

      <div class="row">
        <button id="connect">Connect &amp; Subscribe</button>
        <button id="disconnect" class="secondary">Stop</button>
      </div>

      <label style="margin-top:18px">Send raw message (JSON)</label>
      <textarea id="raw">["REQ","debug",{"kinds":[1]}]</textarea>
      <div class="row">
        <button id="send">Send</button>
        <button id="clear" class="secondary">Clear feed</button>
      </div>
      <p style="color:var(--muted);font-size:11px;margin-top:14px">
        Tip: paste a fully formed <code>["EVENT",{...}]</code> to publish, or a
        <code>["AUTH",{...}]</code> to authenticate.
      </p>
    </section>

    <section class="feed" id="feed">
      <div class="empty">No events yet. Configure a filter and connect.</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
